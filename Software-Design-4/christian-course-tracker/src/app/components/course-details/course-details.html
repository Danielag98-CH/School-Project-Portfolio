<div class="min-h-screen bg-gray-100 py-10">

  <!-- Header -->
  <div class="mx-auto mb-6 flex max-w-3xl items-start justify-between px-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-800">Course Details</h1>
      <p class="text-sm text-gray-500">View and edit the selected course.</p>
    </div>

    <!--  Done button-->
    <button
      (click)="done()"
      class="rounded bg-gray-600 px-4 py-2 text-sm font-medium text-white hover:bg-gray-700"
    >
      Done
    </button>
  </div>

  <!-- Card -->
  <div class="mx-auto max-w-3xl rounded-xl bg-white p-6 shadow">

    @if (invalidId) {
        <div class="flex justify-center">
            <div class="w-full max-w-2xl  bg-white p-8 text-center">

            <h2 class="text-xl font-semibold text-gray-800">
                Course Not Found
            </h2>

            <p class="mt-2 text-sm text-gray-500">
                The course you are looking for does not exist.
            </p>

            <button
                routerLink="/"
                class="mt-6 rounded bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
            >
                Return to Courses
            </button>

            </div>
        </div>

    } @else if (course) {

      <!-- Title -->
      <div class="mb-5">
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Course Title
        </label>
        <input
          type="text"
          [(ngModel)]="course.title"
          class="w-full rounded border border-gray-300 px-3 py-2"
        >
      </div>

      <!-- Instructor + Credits -->
      <div class="mb-5 grid grid-cols-2 gap-4">

        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">
            Instructor
          </label>
          <input
            type="text"
            [(ngModel)]="course.instructor"
            class="w-full rounded border border-gray-300 px-3 py-2"
          >
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">
            Credits
          </label>
          <input
            type="number"
            [(ngModel)]="course.credits"
            class="w-full rounded border border-gray-300 px-3 py-2"
          >
        </div>

      </div>

      <!-- Status -->
      <div class="mb-3">
        <label class="mb-2 block text-sm font-medium text-gray-700">
          Course Status
        </label>

        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            [(ngModel)]="course.isCompleted"
            class="h-4 w-4"
          >
          <span>Completed</span>
        </div>
      </div>

      <!-- Status badge -->
      <div>
        @if (course.isCompleted) {
          <span class="inline-block rounded-full bg-green-100 px-3 py-1 text-sm font-medium text-green-800">
            ✔ This course is completed.
          </span>
        } @else {
          <span class="inline-block rounded-full bg-yellow-100 px-3 py-1 text-sm font-medium text-yellow-800">
            This course is currently in progress.
          </span>
        }
      </div>

    }

  </div>
</div>
