<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="version" content="2025v2">
		<title>Web 2 Quiz SOLUTION</title>
		<script type="text/javascript">
		
		window.addEventListener("load", () => {


			console.log("PROBLEM 1");
			// console log your name below this comment
			console.log("Daniela Gonzalez")

			// You'll use this array to solve the following problems
			const cats = [
				{name:"Garfield", breed:"Tabby"},
				{name:"Felix", breed:"Mut"},
				{name:"Tom", breed:"Siamese"},
				{name:"Bella", breed:"Mut"},
				{name:"Buster", breed:"Siamese"}
			];



			console.log("PROBLEM 2");
			// Use the forEach() method to loop through each element
			// in the cats array, and console log the name property of 
			// each element
			cats.forEach(c => console.log(c.name));



			console.log("PROBLEM 3")
			// Use the filter() method on the cats array to
			// get the elements that have a breed equal to "Siamese".
			// Console log the value that is returned by the filter() method.
			const checkBreed = cats.filter(b => b.breed == "Siamese");
			console.log(checkBreed);



			console.log("PROBLEM 4")
			/*
			Use the map() method on the cats array to create an array
			of strings that looks like this:
				[
					'<option>Garfield</option>', 
					'<option>Felix</option>', 
					'<option>Tom</option>', 
					'<option>Bella</option>', 
					'<option>Buster</option>'
				]

			Store the value that is returned by the map() method
			in a variable named catOptions.

			Console log the catOptions variable
			*/
			const catOption = cats.map(c => "<option>" + c.name + "</option>");
			console.log(catOption);



			console.log("PROBLEM 5");
			// Get a handle on the SELECT element below (in the BODY)
			// and then set it's innerHTML property by joining
			// the elements from the catOptions array
			const select = document.querySelector("[name=cats]");
			select.innerHTML = catOption.join(" ");
			



		});

		</script>
	</head>
	<body>
		<h3>Cat Options</h3>
		<label>Choose a cat:</label>
		<select name="cats"></select>
	</body>
</html>
